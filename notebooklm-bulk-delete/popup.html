<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotebookLM Bulk Delete</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
        </svg>
        <span>NotebookLM Bulk Delete</span>
      </div>
      <button id="refreshBtn" class="icon-btn" title="ソースを再読み込み" aria-label="更新">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <!-- 状態表示エリア -->
    <div id="statusArea" class="status-area hidden">
      <div id="statusMessage" class="status-message"></div>
    </div>

    <!-- 読み込み中 -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>ソースを読み込み中...</p>
    </div>

    <!-- エラー状態 -->
    <div id="errorState" class="error-state hidden">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/>
      </svg>
      <p id="errorMessage">エラーが発生しました</p>
      <p class="error-hint">NotebookLMのノートブックページを開いてから<br>再度お試しください</p>
      <button id="retryBtn" class="btn btn-secondary">再試行</button>
    </div>

    <!-- ソースリスト -->
    <div id="mainContent" class="main-content hidden">
      <!-- コントロールバー -->
      <div class="controls">
        <label class="select-all-label">
          <input type="checkbox" id="selectAll">
          <span>すべて選択</span>
        </label>
        <span id="selectedCount" class="selected-count">0 件選択中</span>
      </div>

      <!-- 検索 -->
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
        </svg>
        <input type="text" id="searchInput" placeholder="ソースを検索..." class="search-input">
      </div>

      <!-- ソースリスト本体 -->
      <ul id="sourceList" class="source-list" role="list">
        <!-- JSで動的生成 -->
      </ul>

      <p id="noSourcesMsg" class="no-sources hidden">
        ソースが見つかりませんでした。<br>
        ノートブックにソースを追加してください。
      </p>
      <p id="noSearchResults" class="no-sources hidden">
        検索結果がありません。
      </p>
    </div>

    <!-- 削除中オーバーレイ -->
    <div id="deleteOverlay" class="delete-overlay hidden">
      <div class="delete-progress-box">
        <div class="spinner spinner-large"></div>
        <p class="delete-progress-title">削除中...</p>
        <p id="deleteProgressText" class="delete-progress-text">準備中</p>
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressFraction" class="progress-fraction">0 / 0</p>
      </div>
    </div>

    <!-- フッター操作エリア -->
    <footer id="footer" class="footer hidden">
      <button id="cancelBtn" class="btn btn-ghost">キャンセル</button>
      <button id="deleteBtn" class="btn btn-danger" disabled>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
        </svg>
        選択したソースを削除
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
